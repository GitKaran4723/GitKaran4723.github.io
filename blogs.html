<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogs By KJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        crossorigin="anonymous" />
</head>

<body class="bg-gray-50 text-gray-800 relative overflow-x-hidden">
    <!-- Navbar -->
    <header class="bg-indigo-800 text-white flex justify-between items-center p-4 sticky top-0 z-50">
        <h1 class="text-2xl font-bold">EchoSphere</h1>
        <button id="menuToggle" class="lg:hidden text-2xl focus:outline-none">
            <i id="menuIcon" class="fas fa-bars"></i>
        </button>
        <nav class="hidden lg:flex gap-6 font-medium">
            <a href="/"
                class="relative px-2 py-1 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-full after:scale-x-0 after:bg-yellow-400 after:transition-transform after:duration-300 hover:after:scale-x-100 hover:text-yellow-400">
                Home
            </a>

            <a href="/about.html"
                class="relative px-2 py-1 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-full after:scale-x-0 after:bg-yellow-400 after:transition-transform after:duration-300 hover:after:scale-x-100 hover:text-yellow-400">
                About Me
            </a>

            <a href="/notes.html"
                class="relative px-2 py-1 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-full after:scale-x-0 after:bg-yellow-400 after:transition-transform after:duration-300 hover:after:scale-x-100 hover:text-yellow-400">
                Notes
            </a>

            <a href="/projects.html"
                class="relative px-2 py-1 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-full after:scale-x-0 after:bg-yellow-400 after:transition-transform after:duration-300 hover:after:scale-x-100 hover:text-yellow-400">
                Projects
            </a>

            <a href="/videos.html"
                class="relative px-2 py-1 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-full after:scale-x-0 after:bg-yellow-400 after:transition-transform after:duration-300 hover:after:scale-x-100 hover:text-yellow-400">
                Videos
            </a>

            <a href="/blogs.html"
                class="relative px-2 py-1 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-full after:scale-x-0 after:bg-yellow-400 after:transition-transform after:duration-300 hover:after:scale-x-100 text-yellow-400">
                Blog
            </a>

            <a href="/updates.html"
                class="relative px-2 py-1 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-full after:scale-x-0 after:bg-yellow-400 after:transition-transform after:duration-300 hover:after:scale-x-100 hover:text-yellow-400">
                Updates
            </a>
        </nav>
    </header>

    <!-- Mobile Menu (Overlay Style) -->
    <div id="mobileMenu"
        class="lg:hidden hide bg-indigo-900 text-white text-lg font-medium transform scale-y-0 opacity-0 origin-top shadow-xl">
        <nav class="flex flex-col items-start p-4 space-y-2 rounded-xl">
            <a href="/" class="w-full block py-2 px-4 rounded hover:bg-indigo-800 transition">Home</a>
            <a href="/about.html" class="w-full block py-2 px-4 rounded hover:bg-indigo-800 transition">About Me</a>
            <a href="/notes.html" class="w-full block py-2 px-4 rounded hover:bg-indigo-800 transition">Notes</a>
            <a href="/projects.html" class="w-full block py-2 px-4 rounded hover:bg-indigo-800 transition">Projects</a>
            <a href="/videos.html" class="w-full block py-2 px-4 rounded hover:bg-indigo-800 transition">Videos</a>
            <a href="/blogs.html" class="w-full block py-2 px-4 rounded hover:bg-indigo-800 transition">Blog</a>
            <a href="/updates.html" class="w-full block py-2 px-4 rounded hover:bg-indigo-800 transition">Updates</a>
        </nav>
    </div>

    <section class="p-6 max-w-6xl mx-auto pb-16">
        <h2 class="text-3xl font-semibold text-center mb-8">Latest Blog Posts</h2>
        <div id="blog-container" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </section>
    
    <script>
        fetch('data/blogs.json')
            .then(response => response.json())
            .then(blogs => {
                const blogContainer = document.getElementById('blog-container');
                blogs.forEach(blog => {
                    const blogTile = document.createElement('div');
                    blogTile.className = "bg-white p-4 rounded-lg shadow-md border border-gray-200 hover:shadow-lg transition-shadow";
                    blogTile.innerHTML = `
                        <img src="${blog.image}" alt="${blog.title}" class="w-full h-48 object-cover rounded-md">
                        <h3 class="text-xl font-semibold mt-4">${blog.title}</h3>
                        <p class="text-sm text-gray-600 mt-2">${blog.description}</p>
                        <a href="/rendernotes.html?mdUrl=${blog.link}&prevpage=blogs.html" class="mt-4 inline-block text-blue-600 font-semibold hover:underline">Read More</a>
                    `;
                    blogContainer.appendChild(blogTile);
                });
            });
    </script>
    

    <!-- Footer -->
    <footer
        class="bg-indigo-800 text-white px-3 py-2 flex justify-around fixed bottom-0 w-full z-40 text-2xl lg:static lg:justify-center lg:gap-6">

        <a href="https://www.youtube.com/@Upadesha"><i class="fab fa-youtube"></i></a>
        <a href="https://github.com/GitKaran4723"><i class="fab fa-github"></i></a>
        <a href="https://www.linkedin.com/in/karan-jadhav-03b5a329b/"><i class="fab fa-linkedin"></i></a>
    </footer>

    <script src="js/menu.js"></script>
</body>

</html>
