<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Playlist with Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .spin {
      animation: spin 1s linear infinite;
    }
  </style>
</head>

<body class="bg-gray-100 text-gray-800">

  <!-- Header -->
  <header class="bg-white shadow-md sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <h1 class="text-xl sm:text-2xl md:text-3xl font-bold text-gray-800 text-center sm:text-left">
        🎥 YouTube <span id="name_of_series" class="text-blue-600"></span> Series
      </h1>
      <a href="/videos.html"
        class="text-sm md:text-base px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-md shadow">
        ⬅ Back to All Series
      </a>
    </div>
  </header>

  <!-- Loader -->
  <div id="loader" class="flex flex-col items-center justify-center min-h-[50vh] text-center py-20">
    <div class="text-5xl spin">🎥</div>
    <p class="mt-4 text-lg text-gray-700 font-semibold">Loading your video playlist...</p>
  </div>

  <!-- Video Container -->
  <div id="video-container" class="max-w-6xl mx-auto px-4 py-6 space-y-6 hidden"></div>

  <script>
    async function loadVideosAndNotes() {
      const params = new URLSearchParams(window.location.search);
      const playlistId = params.get('playlistID');
      const seriesName = params.get('seriesName');
      const fileSeriesName = seriesName.charAt(0).toLowerCase() + seriesName.slice(1);

      // Set series name
      document.getElementById('name_of_series').textContent = seriesName ? decodeURIComponent(seriesName) : 'Video';

      const apiURL = `https://karan4723.pythonanywhere.com/api/playlist/aptitude/${playlistId}`;
      const notesURL = `./data/playlistnoteslinks_${fileSeriesName}.json`;

      const [videoRes, notesRes] = await Promise.all([
        fetch(apiURL),
        fetch(notesURL)
      ]);



      const videos = await videoRes.json();

      console.log(videos)
      const notesList = await notesRes.json();
      const container = document.getElementById('video-container');

      videos.forEach(video => {
        const note = notesList.find(n => n.title === video.title);
        const notesHTML = note
          ? `<div class="mt-3"><a href="/renderplaylistnotes.html?mdUrl=${note.notes}" class="text-blue-600 hover:underline font-medium">📘 Read Notes</a></div>`
          : "";

        container.innerHTML += `
          <div class="bg-white rounded-xl shadow-md p-4 flex flex-col md:flex-row gap-4">
            <a href="https://www.youtube.com/watch?v=${video.videoId}" target="_blank">
              <img src="${video.thumbnail}" alt="${video.title}" class="w-full md:w-60 rounded-lg">
            </a>
            <div class="flex flex-col justify-between">
              <div>
                <h3 class="text-lg md:text-xl font-semibold mb-1 text-gray-900">${video.title}</h3>
                <p class="text-sm text-gray-600 mb-2">${video.description || "No description available."}</p>
                <p class="text-sm text-gray-500"><strong>Published:</strong> ${new Date(video.publishedAt).toDateString()}</p>
                ${notesHTML}
              </div>
            </div>
          </div>
        `;
      });

      // Hide loader, show content
      document.getElementById('loader').style.display = 'none';
      container.classList.remove('hidden');
    }

    loadVideosAndNotes();
  </script>

</body>

</html>
