        #footer-container {

        #footer-container p {

        #social-icons-container {

        .logo-brand {

    <script>
        // JavaScript to toggle mobile menu visibility
        document.addEventListener('DOMContentLoaded', function () {
            var mobileMenu = document.querySelector('.mobile-menu');

            document.addEventListener('click', function (event) {
                var isMobileMenuIcon = event.target.classList.contains('mobile-menu-icon');
                var isMobileMenuLink = event.target.closest('.mobile-menu a');

                if (isMobileMenuIcon || isMobileMenuLink) {
                    // Toggle the visibility of the mobile menu
                    mobileMenu.classList.toggle('show-mobile-menu');
                } else {
                    // Hide the mobile menu if clicking outside the menu icon and links
                    mobileMenu.classList.remove('show-mobile-menu');
                }
            });
        });

        function gotopage(url) {
            window.location.href = url

    </script>
