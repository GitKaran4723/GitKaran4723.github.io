<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SE Syllabus</title>
    <style>
        body {
            
            width: 100vw;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
    
        .sub {
            margin: 5px;
            background: #808000;
            color: white;
            font-weight: bold;
            width: 80%;
            border-radius: 10px;
            padding: 1vw;
            margin: 5px;
            cursor: pointer;
            border: none;
            background-color: #2928b9;
            color: white;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        @media  (max-width:768px){
            .sub{
                padding: 3vw
            }
            
        }
        
        .sub:hover {
            background-color: #2980b9;
        }
        
        
        .icon{
            background-color: rgb(247, 247, 38);
            padding: 5px;
            border-radius: 50%;
            
        }
        .icon:hover{
            width: 2vw;
            cursor: pointer;
        
        }

        li{
            margin-bottom: 10px;
        }

        .hide{
            display:none;
        }
    </style>
</head>

<body>
    <div class="SE">
        <h2 id="SE">December 2023</h2>
        <ul>
            <li>01 Dec 2023 <span class="notes icon hide" onclick="goto()">&#128221</span></li>
            <li>02 Dec 2023 <span class="notes icon" onclick="goto('https://mycurrentaffairsth.blogspot.com/2023/12/02-dec-2023.html')">&#128221</span></li>  
        </ul>   
    </div>
    <script>
        function goto(url) {
            window.location.href = url
        }
    </script>
</body>

</html>
